<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <main>
        <h1 id="titolo1">Ciao nome</h1>

        <form action="" method="post" enctype="multipart/form-data" onsubmit="return false" onreset="return false">
            <input type="text" id="dati" placeholder="Inserisci una stringa...">
            <input type="number" step="1" id="datiN" placeholder="Inserisci una numero..." min="0" max="100">
            <button onclick="recuperaCampo()">INVIA</button>
        </form>

        <p id="dati2"></p>

        <h2>Convertitore di voti:</h2>
        <p>Inserisci un voto da 0 a 100</p>
        <form action="" method="post" enctype="multipart/form-data" onsubmit="return false" onreset="return false">
            <input type="number" id="voto" placeholder="Inserisci un voto..." min="0" max="100">
            <button onclick="recuperaCampoVoto()">INVIA</button>
        </form>

        <p id="risultatoVoto"></p>
    </main>

    <script>
        // esercizio 3

        function recuperaCampo() {
            const dati = document.getElementById("dati").value;
            const datiN = document.getElementById("datiN").value;

            const number = parseInt(datiN);
            
            document.getElementById("dati2").innerText = "La stringa: " + dati + " il numero: " + datiN;

            document.getElementById("dati").value = ""
            document.getElementById("datiN").value = ""
        }

        // esercizio 4
        function recuperaCampoVoto() {
            const voto = document.getElementById("voto").value;
            const number = parseInt(voto);

            let risultato = "";
            if (voto >= 90) {
                risultato = "A";
            } else if (voto >= 80) {
                risultato = "B";
            } else if (voto >= 70) {
                risultato = "C";
            } else if (voto >= 60) {
                risultato = "D";
            } else {
                risultato = "E";
            }

            // verifica che il voto inserito sia compreso tra 0 e 100
            if (voto < 0 || voto > 100) {
                risultato = "⛔️ Voto non valido";
            }

            document.getElementById("risultatoVoto").innerText = "Il tuo voto corrisponde al grado: " + risultato;
            document.getElementById("voto").value = ""
        }
    </script>
</body>

</html>
