<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 20260430_JS_CODE_CLASSLIST_GESTORE_EVENTI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0 auto;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.11);
            max-width: 90%;
        }

        h1 {
            color: #333;
        }

        #box-interattiva {
            width: 150px;
            height: 150px;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.11);
            background-color: lightskyblue;
            margin: 20px auto;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /*
            classi create da JS
        */

        .click-attivo {
            background-color: greenyellow !important;
            transform: scale(0.95);
        }

        .double-click{
            background-color: greenyellow !important;
            border-radius: 50% !important;
        }

        .scrolling{
            transform: rotate(120deg);
        }

        .debug-1og {
            margin-top: 20px;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            border-radius: 8px;
            font-family: monospace;
            min-width: 200px;
            text-align: left;
        }

        .log-entry {
            border-bottom: 1px solid;
            padding: 2px 0px;
        }

        /*
            Media queries
        */
        /*
            è il cuore del responsive design.
            è lo strumento che permette al tuo sito di capire su quale
            dispositivo si trova, puoi creare un @media per ogni
            grandezza che ritieni opportuno
        */

        @media (max-width: 600px) {
            .container {
                width: 100%;
            }

            #box-interattiva {
                width: 100px;
                height: 100px;
                font-size: 10px;
            }
        }

        @media (max-width: 500px) {

            h1 {
                color: red;
            }

            .container {
                width: 100%;
            }

            #box-interattiva {
                width: 100px;
                height: 100px;
                font-size: 10px;
            }
        }

    </style>
</head>

<body>
    <main>
        <div class="container">
            <h1>Laboratorio Eventi JS</h1>
            <p>Prova: Click, Doppio click, Scroll e Resize</p>
            <div id="box-interattiva">INTERAGISCI</div>
            <div id="debug-log">
                <div class="log-entry">In attesa di eventi...</div>
            </div>
        </div>
    </main>

    <script src="./javascript/script2.js" type="module" defer>
    </script>
</body>

</html>
