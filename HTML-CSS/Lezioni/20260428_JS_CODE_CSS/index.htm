<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day11 JS Code & CSS</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

    <main>
        <h1 id="titolo">Day11 JS Code & CSS</h1>
        <button onclick="cambiaColore()">Cambia Colore</button>
        <input type="color" id="colorPicker" oninput="cambiaColorePicker(this.value)">
        <div>
            <input type="number" id="fontSize" value="26" oninput="cambiaFontSize()">
        </div>

        <div>
            <button onclick="cambiaFontSizeUp()">+</button>
            <button onclick="cambiaFontSizeDown()">-</button>
        </div>

        <div>
            <button onclick="toggleBold()">Toggle Title Bold Style</button>
            <p id="weightStatus">Regular</p>
        </div>

        <div id="paddingContainer" class="padding">
            <p>Padding: <span id="paddingValue">0px</span></p>
            <button onclick="cambiaPadding(-3)">-</button>
            <button onclick="cambiaPadding(3)">+</button>
        </div>
    </main>
    
    <script type="module" src="./javascript/script.js">
    </script>
</body>
</html>
